name: Actualización de estadísticas LoL

on:
  workflow_dispatch:
  # Apagado hasta tener una clave personal de Riot: la de desarrollo vence a las 24 h
  # y el cron moriría al día siguiente. Para prenderlo, descomentar estas dos líneas.
  # schedule:
  #   - cron: "17 * * * *"

# Una corrida por vez; no se cancela la que está en curso para no perder partidas bajadas.
concurrency:
  group: actualizar-lol
  cancel-in-progress: false

permissions:
  contents: write   # rama `datos` y assets del release `timelines`; nunca main
  pages: write
  id-token: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Código (main)
        uses: actions/checkout@v4

      - name: Datos (rama datos)
        uses: actions/checkout@v4
        with:
          ref: datos
          path: datos

      - name: Pools objetivo (repo ldh-lol-metas)
        # Repo público aparte, donde el bot escribe con su propio token (solo ese repo). Acá se lee sin
        # token. Si falla, la corrida sigue: solo falta el seguimiento de la pool (ldh/fase5.py).
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: luccabruno3z/ldh-lol-metas
          path: metas

      - name: Timelines (release "timelines")
        # No van a git: se bajan del release, un .tar por mes. Si falla, se corta acá; sin
        # timelines la base saldría sin los datos de los 10 y 15 minutos (ldh/timelines.py).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
          # GitHub a veces devuelve 500 al bajar assets: hasta 3 intentos antes de cortar.
          for i in 1 2 3; do
            gh release download timelines --repo "${{ github.repository }}" -p 'timelines-*.tar' -D tl-tar --clobber && break
            [ "$i" = 3 ] && exit 1
            echo "Falló la descarga (intento $i), reintento en 20 s"; sleep 20
          done

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Caché de Data Dragon
        uses: actions/cache@v4
        with:
          path: .cache
          key: ddragon-${{ github.run_id }}
          restore-keys: ddragon-

      - name: Revisar la clave
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          if [ -z "$RIOT_API_KEY" ]; then echo "::error::Falta el secreto RIOT_API_KEY"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Riot-Token: $RIOT_API_KEY" \
            "https://americas.api.riotgames.com/riot/account/v1/accounts/by-riot-id/LuccaBruno/LAS")
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::La clave de Riot está vencida o es inválida (HTTP $code). No se commitea nada."; exit 1
          fi

      - name: Abrir timelines
        run: python -m ldh timelines desempaquetar tl-tar

      - name: Ingesta, base y publicación
        id: ingesta
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          ANON_SALT: ${{ secrets.ANON_SALT }}
          PYTHONIOENCODING: utf-8
        run: python -m ldh todo

      - name: Commit a la rama datos
        # Aunque falle la publicación, lo ya bajado se guarda: cada partida es un archivo nuevo.
        if: always() && steps.ingesta.outcome != 'skipped'
        working-directory: datos
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Datos: corrida ${{ github.run_number }}"
          git pull --rebase origin datos  # por si entró un commit a mano (informes) mientras corría
          git push origin HEAD:datos

      - name: Subir timelines nuevas al release
        # Solo los meses que cambiaron en esta corrida; --clobber reemplaza el .tar de ese mes.
        if: always() && steps.ingesta.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ldh timelines empaquetar tl-nuevos --desde "$INICIO"
          if ls tl-nuevos/*.tar >/dev/null 2>&1; then
            gh release upload timelines tl-nuevos/*.tar --clobber --repo "${{ github.repository }}"
          fi

      - name: Base completa al release "base"
        # La base (~300 MB y creciendo) no va a Pages: era el archivo que más tardaba en sincronizar (un deploy quedó
        # 10 min en "syncing_files") y cuenta para el límite de 1 GB del sitio. En un release el límite es 2 GB por
        # archivo. Se reemplaza en cada corrida; si falla, la web sale igual (ni la web ni el bot la usan).
        id: base
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          gh release view base --repo "$repo" >/dev/null 2>&1 || gh release create base --repo "$repo"             --title "Base completa (SQLite)" --notes "ldh.sqlite: se rehace de cero en cada corrida desde la rama datos y el release timelines. Se reemplaza en cada actualización."
          gh release upload base salida/descargas/ldh.sqlite --clobber --repo "$repo"

      - name: Sacar la base del sitio
        run: rm -f salida/descargas/ldh.sqlite

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: salida

      - name: Publicar en Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true  # si se cuelga del lado de GitHub, se reintenta una vez abajo
        with:
          timeout: 1200000  # 20 min (el default es 10)

      - name: Publicar en Pages (reintento)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

      - name: Avisar por Discord si no se subió la base
        if: steps.base.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json"               -d "{\"content\":\"⚠️ LDH Stats LoL: la web se publicó, pero no se pudo subir la base al release: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"               "$DISCORD_WEBHOOK"
          fi

      - name: Avisar por Discord si falló
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ Falló la actualización de LDH Stats LoL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK"
          fi
